name: Keep scheduled workflows active

on:
  schedule:
    - cron: "47 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clamav-repository-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Commit heartbeat only after 30 days without repository activity
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          last_commit=$(git log -1 --format=%ct)
          age_days=$(( (now - last_commit) / 86400 ))
          if [ "$age_days" -lt 30 ]; then
            printf 'Repository activity is %s days old; heartbeat not needed.\n' "$age_days"
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m 'chore: keep scheduled ClamAV updates active'
          git push origin HEAD:main
