name: Update ClamAV DBs

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clamav-release-publisher
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted build scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies and sigtool
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clamav
          command -v sigtool

      - name: Download official signed databases
        shell: bash
        run: |
          set -euo pipefail
          cvd update
          for db in daily main bytecode; do
            test -s "$HOME/.cvdupdate/database/${db}.cvd"
          done

      - name: Read previous immutable snapshot metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_previous_snapshot.py \
            --repo "$GITHUB_REPOSITORY" \
            --output previous-snapshot.json

      - name: Build and verify deterministic snapshot
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --db-dir "$HOME/.cvdupdate/database"
            --out-dir out
            --sigtool sigtool
            --min-size 100000
          )
          if [ -f previous-snapshot.json ]; then
            args+=(--previous-snapshot previous-snapshot.json)
          fi
          python scripts/build_snapshot.py "${args[@]}"
          (cd out && sha256sum --check SHA256SUMS)

      - name: Upload verified snapshot between jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clamav-snapshot
          path: out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download verified snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clamav-snapshot
          path: snapshot

      - name: Publish immutable draft, verify, then switch latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_snapshot.py \
            --repo "$GITHUB_REPOSITORY" \
            --snapshot-dir snapshot \
            --target "$GITHUB_SHA"
